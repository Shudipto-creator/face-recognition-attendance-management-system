<!DOCTYPE html>  
<html>  
<head>  
    <title>Student Attendance Database</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #070a12, #0b1630);
      color: rgba(255,255,255,.92);
    }
    #page::before{
      content: "";
      position: absolute;
      background: radial-gradient(900px 420px at 50% 0%, rgba(69,214,255,.10), transparent 60%);
      opacity: 1;
      height: 100%;
      z-index: -1;
      width: 100%;
    }
    #page { position: relative; }
    .container{
      width: min(1100px, 96vw);
      margin: 30px auto 0;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 18px 18px 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }
    h1,h3{ color: rgba(255,255,255,.92) !important; }
    h3{
      color: rgba(255,255,255,.92) !important;
      margin: 0 0 12px 0;
    }
    .text-center{ text-align:center; }
    table.table{
      width:100%;
      border-collapse: collapse;
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.9);
      border-radius: 14px;
      overflow:hidden;
    }
    table.table thead th{
      font-weight: 800;
      color: rgba(255,255,255,.92);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      padding: 12px 12px;
      text-align: left;
    }
    table.table td{
      padding: 12px 12px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .btn{
      appearance:none;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(69,214,255,.18), rgba(124,92,255,.16));
      color: rgba(255,255,255,.92);
      font-weight: 800;
      cursor:pointer;
      transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.06); }
    .btn:focus{ outline:none; box-shadow: 0 0 0 4px rgba(69,214,255,.18), 0 10px 30px rgba(0,0,0,.25); }
    h1[style]{ color: rgba(255,255,255,.92) !important; }
  </style>
</head> 
<body>  
    <section id="page">
    <div class="container">
        <br><br><br>
        <h1 class="text-center"> <strong> Today's Attendance</strong></h1>
        <br><br><br>
        <h3 style="font-style:verdana;">Details of student present today:</h3>
        <br>

        <form action="/data" method="post" style="margin: 0 0 18px 0; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end;">
            <div>
                <label style="display:block; margin: 0 0 6px 0; color: rgba(255,255,255,.78); font-weight: 700;">School</label>
                <select id="department_id" name="department_id" style="width:100%; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.20); color: rgba(255,255,255,.92);">
                    <option value="">All Schools</option>
                    {% for d in departments %}
                      <option value="{{ d["Id"] }}">{{ d["Name"] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; margin: 0 0 6px 0; color: rgba(255,255,255,.78); font-weight: 700;">Major</label>
                <select id="major_id" name="major_id" style="width:100%; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.20); color: rgba(255,255,255,.92);">
                    <option value="">All Majors</option>
                    {% for m in majors %}
                      <option value="{{ m["Id"] }}" data-school="{{ m["DepartmentId"] }}">{{ m["DepartmentName"] }} — {{ m["Name"] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display:block; margin: 0 0 6px 0; color: rgba(255,255,255,.78); font-weight: 700;">Course</label>
                <select id="course_id" name="course_id" style="width:100%; padding: 12px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.20); color: rgba(255,255,255,.92);">
                    <option value="">All Courses</option>
                    {% for c in courses %}
                      <option value="{{ c["Id"] }}" data-school="{{ c["DepartmentId"] }}" data-major="{{ c["MajorId"] }}">{{ c["DepartmentName"] }} — {{ c["MajorName"] }} — {{ c["Name"] }}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn" type="submit">Filter</button>
        </form>
        <br><br><br>
<table class="table table-bordered">  
    <thead>
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>School</th>
            <th>Major</th>
            <th>Course</th>
            <th>Time</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
    {% for row in rows %}  
        <tr>  
            <td>{{row["NAME"]}}</td>
            <td>{{row["RollNo"]}}</td>
            <td>{{row["DepartmentName"]}}</td>
            <td>{{row["MajorName"]}}</td>
            <td>{{row["CourseName"]}}</td>
            <td>{{row["Time"]}}</td>  
            <td>{{row["Date"]}}</td>  
        </tr>  
    {% endfor %}
    </tbody>
</table>  

<br><br>  
<form action="/attendance/today/report.pdf" method="get">
    <input type="hidden" id="pdf_department_id" name="department_id" value="">
    <input type="hidden" id="pdf_major_id" name="major_id" value="">
    <input type="hidden" id="pdf_course_id" name="course_id" value="">
    <button class="btn" type="submit">Download Today's Attendance Report (PDF)</button>
</form>
<br>
<form action="/catalog" method="get">
    <button class="btn" type="submit">Manage Schools, Majors & Courses</button>
</form>
<br>
<form action="/whole" method="post">
    <button class="btn" type="submit">View Whole Database</button>
</form>  
<br>
<form action="/statistics" method="get">
    <button class="btn" type="submit">View Attendance Statistics</button>
</form>
<br>
<form action="/how" method="GET">
    <button class="btn" type="submit">Go back to home page</button>
</form> 
</div>
</section>
<script>
  (function(){
    var dept = document.getElementById('department_id');
    var major = document.getElementById('major_id');
    var course = document.getElementById('course_id');
    var pdfDept = document.getElementById('pdf_department_id');
    var pdfMajor = document.getElementById('pdf_major_id');
    var pdfCourse = document.getElementById('pdf_course_id');
    if(!dept || !major || !course || !pdfDept || !pdfMajor || !pdfCourse) return;

    function syncPdf(){
      pdfDept.value = dept.value || '';
      pdfMajor.value = major.value || '';
      pdfCourse.value = course.value || '';
    }

    function filterMajors(){
      var schoolId = dept.value;
      var opts = major.querySelectorAll('option[data-school]');
      opts.forEach(function(o){
        o.style.display = (!schoolId || o.getAttribute('data-school') === schoolId) ? '' : 'none';
      });
      major.value = '';
      filterCourses();
    }

    function filterCourses(){
      var schoolId = dept.value;
      var majorId = major.value;
      var opts = course.querySelectorAll('option[data-school]');
      opts.forEach(function(o){
        var okSchool = (!schoolId || o.getAttribute('data-school') === schoolId);
        var okMajor = (!majorId || o.getAttribute('data-major') === majorId);
        o.style.display = (okSchool && okMajor) ? '' : 'none';
      });
      syncPdf();
    }

    dept.addEventListener('change', filterMajors);
    major.addEventListener('change', filterCourses);
    course.addEventListener('change', syncPdf);
    syncPdf();
  })();
</script>
</body>  
</html>
