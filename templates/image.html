<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <style>
        body{
            margin:0;
            min-height:100vh;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #070a12, #0b1630);
            color: rgba(255,255,255,.92);
        }

        /* replace photo background */
        #page{
            min-height:100vh;
            display:grid;
            place-items:center;
            position:relative;
            overflow:hidden;
            padding: 18px;
        }
        #page::before{
            content:"";
            position:absolute;
            inset:-40px;
            background:
                radial-gradient(900px 420px at 50% 10%, rgba(69,214,255,.10), transparent 60%),
                radial-gradient(850px 420px at 20% 0%, rgba(124,92,255,.14), transparent 62%),
                linear-gradient(120deg, rgba(255,255,255,.05), transparent 40%, rgba(255,255,255,.03));
            animation: floatBg 9s ease-in-out infinite alternate;
            z-index:-1;
        }
        @keyframes floatBg{
            from{ transform: translateY(0) scale(1); }
            to{ transform: translateY(-12px) scale(1.02); }
        }

        .container{
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
            padding: 22px;
            text-align:center;
        }
        h1{ margin: 0 0 14px; color: rgba(255,255,255,.92); }

        .btn{
            appearance:none;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.18);
            padding: 10px 16px;
            background: linear-gradient(135deg, rgba(69,214,255,.18), rgba(124,92,255,.16));
            color: rgba(255,255,255,.92);
            font-weight: 800;
            cursor:pointer;
            transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        .btn:hover{ transform: translateY(-1px); filter: brightness(1.06); }
        .btn:focus{ outline:none; box-shadow: 0 0 0 4px rgba(69,214,255,.18), 0 10px 30px rgba(0,0,0,.25); }
    </style>
</head>
<body>
    <section id="page">
    <div class="container" style="text-align: center;color:inherit">
        <br><br><br><br><br><br>
    <h1 style="font-size: 35px;"><strong> Your image has been captured!</strong></h1>
    <br><br><br><br>
    <form action="/" method="GET">
    <button class="btn" type="submit">Go to main Page</button>

</form>
</div>
</section>
</body>
</html>
