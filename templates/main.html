<!DOCTYPE html>
<html lang="en">
<head>
  <title>Attendance Management</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge"> 

  <style>
    /* Modernized layout (scoped to this page) */
    :root{
      --bg0:#070a12;
      --bg1:#0b1630;
      --glass: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --brand: #45d6ff;
      --brand2:#7c5cff;
      --ok:#22c55e;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --r: 18px;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Bree Serif", sans-serif;
      background:
        radial-gradient(1000px 500px at 10% 0%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 550px at 90% 20%, rgba(69,214,255,.25), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      position: relative;
      min-height:100vh;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(800px 380px at 20% 10%, rgba(69,214,255,.10), transparent 60%),
        radial-gradient(700px 340px at 80% 30%, rgba(124,92,255,.12), transparent 62%),
        linear-gradient(120deg, rgba(255,255,255,.04), transparent 35%, rgba(255,255,255,.03));
      filter: blur(0px);
      opacity: .9;
      pointer-events: none;
      z-index: -3;
      animation: floatBg 10s ease-in-out infinite alternate;
    }

    @keyframes floatBg{
      from{ transform: translate3d(0,0,0) scale(1); }
      to{ transform: translate3d(0,-10px,0) scale(1.02); }
    }

    /* Navbar */
    #navbar{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:14px 22px;
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.25));
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    #navbar::before{ display:none; } /* disable old overlay */
    #logo{ margin:0; display:flex; align-items:center; gap:12px; }
    #logo img{ height:46px; width:46px; margin:0; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    #navbar ul{
      margin:0;
      padding:0;
      display:flex;
      align-items:center;
      gap:10px;
      list-style:none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #navbar ul li{ font-size:1.05rem; }
    #navbar ul li a{
      display:inline-flex;
      align-items:center;
      padding:10px 14px;
      border-radius: 999px;
      color:var(--text);
      text-decoration:none;
      border: 1px solid transparent;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      background: transparent;
    }
    #navbar ul li a:hover{
      transform: translateY(-1px);
      background: var(--glass);
      border-color: var(--stroke);
      color: var(--text);
    }

    /* Hero */
    #home{
      position:relative;
      display:grid;
      place-items:center;
      padding: min(7vw, 80px) 20px;
      min-height: calc(100vh - 78px);
      text-align:center;
      isolation:isolate;
    }
    #home::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(900px 420px at 50% 20%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(700px 340px at 18% 10%, rgba(69,214,255,.14), transparent 60%),
        radial-gradient(700px 340px at 82% 30%, rgba(124,92,255,.16), transparent 62%),
        linear-gradient(180deg, rgba(7,10,18,.30), rgba(7,10,18,.75));
      z-index:-2;
      opacity:1;
    }

    .hero-card{
      width: min(980px, 94vw);
      padding: 34px 22px;
      border-radius: var(--r);
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: enterUp .7s ease both;
    }

    .h-primary{
      margin:0 0 10px;
      font-size: clamp(1.65rem, 3.2vw, 2.7rem);
      line-height:1.15;
      font-weight: 800;
      letter-spacing:.2px;
      color: #eaf6ff;
      text-shadow: 0 12px 50px rgba(0,0,0,.45);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .hero-sub{
      margin: 0 auto 18px;
      max-width: 62ch;
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.15rem);
    }

    .cta-row{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
      margin-top: 16px;
    }

    /* Buttons (override old .btn) */
    .btn{
      border: 1px solid rgba(255,255,255,.18) !important;
      background: linear-gradient(135deg, rgba(69,214,255,.18), rgba(124,92,255,.16)) !important;
      color: var(--text) !important;
      border-radius: 999px !important;
      padding: 12px 18px !important;
      font-size: 1.05rem !important;
      letter-spacing:.2px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      filter: brightness(1.06);
    }
    .btn:focus{ outline: none; box-shadow: 0 0 0 4px rgba(69,214,255,.25), 0 18px 60px rgba(0,0,0,.35); }

    .rounded-circle{ border-radius: 999px; }
    .text-center{ text-align:center; }
    .btn-large{ font-size: 1.05rem; }

    footer{
      background: rgba(0,0,0,.55);
      border-top: 1px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.75);
      padding: 14px 20px;
      text-align:center;
    }

    /* Animations */
    @keyframes enterUp{
      from{ opacity:0; transform: translateY(14px); }
      to{ opacity:1; transform: translateY(0); }
    }
    @keyframes fadeIn{
      from{ opacity:0; }
      to{ opacity:1; }
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; scroll-behavior:auto; }
    }

    /* Responsive tweaks */
    @media (max-width: 768px){
      #navbar{ padding: 12px 14px; }
      #navbar ul{ gap:6px; flex-wrap:wrap; justify-content:flex-end; }
      #home{ padding: 40px 14px; }
    }
    </style>
  </head>
  <body>
 <nav id="navbar">
    <div id="logo">
        <img src="{{url_for('static',filename='images/key-person2.png')}}" class="rounded-circle" alt="Icon">
    </div>
<ul>
    <li class="item"><a href="#home">Home</a></li>
    <li class="item"><a href="/how">Admin Login</a></li> 
</ul>
</nav>  

<section id="home">
  <div class="hero-card">
    <h2 class="h-primary text-center"><strong>Face Recognition based Attendance Management System</strong></h2>
    <p class="hero-sub">Register students and mark attendance quickly.</p>

    <div class="cta-row">
      <!-- Use GET to open the registration page -->
      <form action="/new" method="GET" style="display:inline-block;margin:0;">
        <button type="submit" class="btn btn-primary btn-large">Register New Student</button>
      </form>
      <form action="/" method="post" style="display:inline-block;margin:0; min-width: min(720px, 94vw);">
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items:end; width:100%;">
          <div style="text-align:left;">
            <label for="department_id" style="display:block; font-size:.9rem; color: rgba(255,255,255,.78); margin: 0 0 6px;">School</label>
            <select id="department_id" name="department_id" required style="width:100%; padding: 12px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: rgba(255,255,255,.92);">
              <option value="" disabled selected>Select School</option>
              {% for d in departments %}
                <option value="{{ d["Id"] }}">{{ d["Name"] }}</option>
              {% endfor %}
            </select>
          </div>
          <div style="text-align:left;">
            <label for="major_id" style="display:block; font-size:.9rem; color: rgba(255,255,255,.78); margin: 0 0 6px;">Major</label>
            <select id="major_id" name="major_id" required style="width:100%; padding: 12px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: rgba(255,255,255,.92);">
              <option value="" disabled selected>Select Major</option>
              {% for m in majors %}
                <option value="{{ m["Id"] }}" data-school="{{ m["DepartmentId"] }}">{{ m["DepartmentName"] }} — {{ m["Name"] }}</option>
              {% endfor %}
            </select>
          </div>
          <div style="text-align:left;">
            <label for="course_id" style="display:block; font-size:.9rem; color: rgba(255,255,255,.78); margin: 0 0 6px;">Course</label>
            <select id="course_id" name="course_id" required style="width:100%; padding: 12px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: rgba(255,255,255,.92);">
              <option value="" disabled selected>Select Course</option>
              {% for c in courses %}
                <option value="{{ c["Id"] }}" data-school="{{ c["DepartmentId"] }}" data-major="{{ c["MajorId"] }}">{{ c["DepartmentName"] }} — {{ c["MajorName"] }} — {{ c["Name"] }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-large">Punch your Attendance</button>
        </div>
      </form>
    </div>
  </div>
</section>
<script>
  (function(){
    var dept = document.getElementById('department_id');
    var major = document.getElementById('major_id');
    var course = document.getElementById('course_id');
    if(!dept || !major || !course) return;

    function filterMajors(){
      var schoolId = dept.value;
      var opts = major.querySelectorAll('option[data-school]');
      opts.forEach(function(o){
        o.style.display = (!schoolId || o.getAttribute('data-school') === schoolId) ? '' : 'none';
      });
      major.value = '';
      filterCourses();
    }

    function filterCourses(){
      var schoolId = dept.value;
      var majorId = major.value;
      var opts = course.querySelectorAll('option[data-school]');
      opts.forEach(function(o){
        var okSchool = (!schoolId || o.getAttribute('data-school') === schoolId);
        var okMajor = (!majorId || o.getAttribute('data-major') === majorId);
        o.style.display = (okSchool && okMajor) ? '' : 'none';
      });
      course.value = '';
    }

    dept.addEventListener('change', filterMajors);
    major.addEventListener('change', filterCourses);
  })();
</script>
</body>
</html>
